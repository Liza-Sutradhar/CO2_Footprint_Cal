<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>total emission</title>
    <link rel="stylesheet" href="css/result.css">
</head>
<body>
    
</body>
</html>
<section class="result-section">

    <h2>Your Carbon Footprint</h2>

    <div class="result-card">

        <div class="footprint-result">
            <span id="carbonValue">6.2</span>
            <span class="unit">tCO₂e/year</span>
        </div>

        <p class="result-description">
            This is your estimated annual carbon footprint.
        </p>

        <!-- Carbon Scale -->
        <div class="carbon-scale-container">

            <!-- Global Average Marker -->
            <div class="global-marker">
                <div class="global-dot"></div>
                <span>Global Average</span>
            </div>

            <!-- User Marker -->
            <div class="user-marker" id="userMarker">
                <div class="triangle"></div>
                <span>You</span>
            </div>

            <!-- Colored Scale -->
            <div class="carbon-scale"></div>

            <!-- Scale Labels -->
            <div class="scale-labels">
                <span>0</span>
                <span>2</span>
                <span>4.7</span>
                <span>10</span>
                <span>15+</span>
            </div>

        </div>

        <!-- Comparison Message -->
        <div class="comparison-message" id="comparisonMessage">
            Around the global average.
        </div>

    </div>

</section>
